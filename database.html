<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Database</title>
<link rel="stylesheet" href="shell.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --head:#E4E8EC; --ink:#1C2430; --muted:#5E6A77; --line:#D5DBE0;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --use:#1F5FD1; --use-soft:#E3ECFB;
  --warn:#9A5B00; --warn-soft:#FBEBCF; --off:#6B7480; --off-soft:#E6E9EC; --danger:#B42318;
  --shadow:0 1px 2px rgba(28,36,48,.06),0 8px 24px rgba(28,36,48,.08);
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#161C23; --surface:#1F2731; --surface-2:#252E39; --head:#2A3440; --ink:#E7ECF1; --muted:#9AA6B3; --line:#33404D;
    --accent:#6E9BF0; --accent-ink:#0E1620; --accent-soft:#22324C;
    --ok:#5CC991; --ok-soft:#1C3A2B; --use:#7FA6F2; --use-soft:#22324C;
    --warn:#E8B04F; --warn-soft:#3D3019; --off:#9AA3AD; --off-soft:#2C343E; --danger:#F07467;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161C23; --surface:#1F2731; --surface-2:#252E39; --head:#2A3440; --ink:#E7ECF1; --muted:#9AA6B3; --line:#33404D;
  --accent:#6E9BF0; --accent-ink:#0E1620; --accent-soft:#22324C;
  --ok:#5CC991; --ok-soft:#1C3A2B; --use:#7FA6F2; --use-soft:#22324C;
  --warn:#E8B04F; --warn-soft:#3D3019; --off:#9AA3AD; --off-soft:#2C343E; --danger:#F07467;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.booting .wrap{visibility:hidden}
.wrap{max-width:1600px;margin:0 auto;padding:24px 24px 48px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.nav{display:flex;gap:4px;margin-bottom:10px}
.nav a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;font-stretch:72%}
.count{color:var(--muted);margin-top:4px}
.who{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}

.filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.filters input,.filters select{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}

.banner{display:none;margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.show{display:block}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
thead th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th button{all:unset;display:flex;align-items:center;gap:6px;padding:14px 14px;cursor:pointer;width:100%;box-sizing:border-box}
thead th button:hover{color:var(--ink)}
thead th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
thead th .arrow{opacity:.35;font-size:10px}
thead th[aria-sort] .arrow{opacity:1;color:var(--ink)}
thead th.plain{padding:14px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td.muted{color:var(--muted)}
td.idc{font-weight:800;font-stretch:72%;font-size:16px;letter-spacing:.02em}
td.num,th.num{text-align:right}
th.num button{justify-content:flex-end}
td.wrapcell{white-space:normal;min-width:180px;max-width:280px}
.cat{display:inline-flex;align-items:center;gap:7px}
.cat .ic{font-size:16px;line-height:1}
.thumb{width:48px;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;padding:0;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{border-style:dashed;color:var(--muted);font-size:10px;line-height:1.2;text-align:center;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-available{background:var(--ok-soft);color:var(--ok)}
.s-in-use{background:var(--use-soft);color:var(--use)}
.s-repair{background:var(--warn-soft);color:var(--warn)}
.s-retired{background:var(--off-soft);color:var(--off)}
.s-disposed{background:var(--off-soft);color:var(--danger)}
.flag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn)}
tfoot td{position:sticky;bottom:0;background:var(--head);font-weight:700;padding:14px;border-top:2px solid var(--ink);white-space:nowrap}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:20px;font-stretch:80%;margin-bottom:6px}

/* Columns popover */
.colpop{position:relative}
.colmenu{position:absolute;right:0;top:46px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;width:240px;max-height:60vh;overflow:auto}
.colmenu[hidden]{display:none}
.colmenu label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.colmenu label:hover{background:var(--surface-2)}
.colmenu input{accent-color:var(--accent);width:16px;height:16px}
.colmenu .reset{margin:6px 8px 2px}

dialog.lightbox{border:0;padding:0;background:transparent;max-width:min(92vw,1000px);max-height:90vh}
dialog.lightbox::backdrop{background:rgba(10,14,20,.8)}
dialog.lightbox img{display:block;max-width:100%;max-height:82vh;border-radius:10px}
dialog.lightbox .cap{color:#E7ECF1;margin-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
dialog.lightbox button{background:#E7ECF1;color:#1C2430;border:0;border-radius:8px;height:36px;padding:0 14px;font-weight:600;cursor:pointer}

dialog.dlg{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(860px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog.dlg::backdrop{background:rgba(10,14,20,.45)}
.dlgin{padding:22px}
.dlgin h2{margin:0 0 4px;font-size:24px;font-stretch:80%}
.dlgin h3{margin:18px 0 8px;font-size:15px}
.dlgin .lead{margin:0 0 14px;color:var(--muted)}
.drop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:26px;border:2px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mapgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.mapgrid label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapgrid select{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:0 6px;font-weight:400}
.prev{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:220px}
.prev table{min-width:0;font-size:13px}
.prev th{position:static;text-transform:none;letter-spacing:0;background:var(--head);padding:8px 10px;text-align:left;white-space:nowrap}
.prev td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
.radios{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.imperr{color:var(--danger);font-size:14px;min-height:1.4em;margin-top:10px}
details{margin-top:10px;font-size:14px;color:var(--muted)} details ul{margin:6px 0 0;padding-left:20px}
[hidden]{display:none!important}
@media (max-width:640px){ .wrap{padding:18px 12px 40px} h1{font-size:28px} .tablebox{max-height:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script src="shell.js" data-page="database"></script>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Asset Database</h1>
      <div class="count" id="count">Loading…</div>
    </div>
    <div>
            <div class="actions">
        <div class="colpop">
          <button class="btn" id="colBtn" type="button" aria-expanded="false" aria-controls="colMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h16M9 3v18M15 3v18"/></svg>Columns</button>
          <div class="colmenu" id="colMenu" hidden></div>
        </div>
        <button class="btn" id="importBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0-4 4m4-4 4 4M5 3h14"/></svg>Import</button>
        <button class="btn" id="exportBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Export CSV</button>
        <a class="btn primary" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add asset</a>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="status"></div>

  <div class="filters">
    <input class="q" id="q" type="search" placeholder="Search any column…" aria-label="Search any column">
    <select id="fProp" aria-label="Filter by property"></select>
    <select id="fCat" aria-label="Filter by category"></select>
    <select id="fLoc" aria-label="Filter by location"></select>
    <select id="fStatus" aria-label="Filter by status"></select>
  </div>

  <div class="tablebox" id="tablebox"><div class="empty">Loading assets…</div></div>
</div>

<dialog class="dlg" id="importDlg" aria-labelledby="impTitle">
  <div class="dlgin">
    <h2 id="impTitle">Import assets</h2>
    <div id="impStep1">
      <p class="lead">Upload a CSV or Excel file. The first row should be the column headings, like Property, Asset name, Brand, Serial #, Category. You’ll see a preview before anything is saved.</p>
      <div class="drop">
        <label class="btn primary" style="cursor:pointer">Choose file<input type="file" id="impFile" accept=".csv,.xlsx,.xls,text/csv" hidden></label>
        <button type="button" class="linkish" id="impTemplate">Download a template</button>
      </div>
    </div>
    <div id="impStep2" hidden>
      <p class="lead" id="impSummary"></p>
      <h3>Match your columns</h3>
      <div class="mapgrid" id="impMap"></div>
      <div id="impDupBox" hidden>
        <h3>If an ID already exists</h3>
        <div class="radios"><label><input type="radio" name="impDup" value="skip" checked> Skip that row</label><label><input type="radio" name="impDup" value="update"> Update the existing asset</label></div>
      </div>
      <h3>Preview</h3>
      <div class="prev" id="impPreview"></div>
      <div id="impNotes"></div>
    </div>
    <div class="imperr" id="impErr" role="status"></div>
    <div class="dlg-actions"><button class="btn" type="button" id="impCancel">Cancel</button><button class="btn primary" type="button" id="impGo" hidden>Import</button></div>
  </div>
</dialog>

<dialog class="lightbox" id="lightbox">
  <img id="lbImg" alt="">
  <div class="cap"><span id="lbCap"></span><span><button type="button" id="lbOpen">Open record</button> <button type="button" id="lbClose">Close</button></span></div>
</dialog>

<script>
(function(){
"use strict";
const SUPABASE_URL = "https://etiqbblpenjqdkkmdbjm.supabase.co";
const SUPABASE_KEY = "sb_publishable_RioLcLmP4qQxil5OXO8p-A_OjD9lY5D";
const PHOTO_BUCKET = "asset-photos";
const COLS_KEY = "asset-db-columns-v1";

const STATUS = { "available":"Available", "in-use":"In use", "repair":"In repair", "retired":"Retired", "disposed":"Disposed" };
const CAT_ICONS = {
  "IT / Electronics":"💻", "Communication Equipment":"📱", "Office Equipment":"🖨️", "Audio / Visual":"📺",
  "Appliances":"🔌", "Kitchen Equipment":"🍳", "Furniture":"🪑", "Vehicles / Transportation":"🚚",
  "Tools / Equipment":"🔧", "Housekeeping":"🧹", "Laptop":"💻", "Desktop":"🖥️", "Monitor":"🖥️", "Phone":"📱",
  "Tablet":"📱", "Printer":"🖨️", "Network":"🌐", "Vehicle":"🚚", "Tool":"🔧", "Other":"📦"
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 864e5;
const hasVal = v => v !== "" && v != null && !isNaN(v);
function parseDay(d){ if(!d) return null; const t = new Date(d + "T00:00:00"); return isNaN(t) ? null : t; }
function fmtDay(d){ const t = parseDay(d); return t ? t.toLocaleDateString(undefined, { dateStyle:"medium" }) : ""; }
function fmtMoney(v){ return hasVal(v) ? Number(v).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 }) : ""; }
function bookValue(a){
  if(!hasVal(a.value) || !Number(a.usefulLife) || !a.purchaseDate) return null;
  const t = parseDay(a.purchaseDate); if(!t) return null;
  const yrs = Math.max(0, (Date.now() - t) / (365.25*DAY));
  return Math.max(0, Number(a.value) * (1 - yrs / Number(a.usefulLife)));
}
function idNum(id){ const m = /(\d+)$/.exec(id || ""); return m ? parseInt(m[1], 10) : 0; }

/* ---------- Columns ---------- */
const COLS = [
  { k:"property", label:"Property", cls:"muted" },
  { k:"id", label:"ID", cls:"idc", sort:a => idNum(a.id) },
  { k:"photo", label:"Photo", nosort:true, render:a => thumbHtml(a) },
  { k:"name", label:"Asset name" },
  { k:"manufacturer", label:"Brand" },
  { k:"model", label:"Model", hidden:true },
  { k:"serial", label:"Serial #" },
  { k:"category", label:"Category", render:a => a.category ? '<span class="cat"><span class="ic" aria-hidden="true">'+(CAT_ICONS[a.category] || "📦")+'</span>'+esc(a.category)+'</span>' : "" },
  { k:"subcategory", label:"Sub-category" },
  { k:"location", label:"Location" },
  { k:"actualLocation", label:"Actual location" },
  { k:"department", label:"Department", hidden:true },
  { k:"assignee", label:"Assigned to" },
  { k:"status", label:"Status", text:a => STATUS[a.status] || "", render:a => a.status ? '<span class="pill s-'+esc(a.status)+'">'+esc(STATUS[a.status] || a.status)+'</span>' : "" },
  { k:"condition", label:"Condition" },
  { k:"purchaseDate", label:"Purchased", text:a => fmtDay(a.purchaseDate), sort:a => a.purchaseDate || "" },
  { k:"supplier", label:"Supplier", hidden:true },
  { k:"invoice", label:"Invoice / PO", hidden:true },
  { k:"value", label:"Cost", num:true, text:a => fmtMoney(a.value), sort:a => hasVal(a.value) ? Number(a.value) : -1, total:true },
  { k:"_bv", label:"Current value", num:true, val:a => bookValue(a), text:a => { const v = bookValue(a); return v == null ? "" : fmtMoney(v); }, sort:a => { const v = bookValue(a); return v == null ? -1 : v; }, total:true },
  { k:"warrantyEnd", label:"Warranty ends", text:a => fmtDay(a.warrantyEnd), sort:a => a.warrantyEnd || "",
    render:a => a.warrantyEnd ? esc(fmtDay(a.warrantyEnd)) + (parseDay(a.warrantyEnd) < Date.now() - DAY ? '<span class="flag">Expired</span>' : "") : "" },
  { k:"nextService", label:"Next service", hidden:true, text:a => fmtDay(a.nextService), sort:a => a.nextService || "" },
  { k:"notes", label:"Notes", hidden:true, cls:"wrapcell" }
];
const cellText = (c, a) => c.text ? c.text(a) : (a[c.k] == null ? "" : String(a[c.k]));
let visible = new Set(COLS.filter(c => !c.hidden).map(c => c.k));
try{ const saved = JSON.parse(localStorage.getItem(COLS_KEY) || "null"); if(Array.isArray(saved) && saved.length) visible = new Set(saved.filter(k => COLS.some(c => c.k === k))); }catch(e){}
function saveCols(){ try{ localStorage.setItem(COLS_KEY, JSON.stringify([...visible])); }catch(e){} }

/* ---------- State ---------- */
let sb = null, me = null, channel = null, assets = [], loaded = false, myName = "";
let sortKey = "id", sortDir = 1;
const filter = { q:"", prop:"", cat:"", loc:"", status:"" };
const photoUrls = new Map();

function thumbHtml(a){
  if(!a.photo) return '<span class="thumb none">No<br>photo</span>';
  const u = photoUrls.get(a.photo);
  return '<button type="button" class="thumb" data-photo="'+esc(a.id)+'" aria-label="View photo of '+esc(a.name)+'">'+(u ? '<img loading="lazy" alt="" src="'+esc(u)+'">' : '')+'</button>';
}
async function loadPhotoUrls(){
  const paths = [...new Set(assets.map(a => a.photo).filter(p => p && !photoUrls.has(p)))];
  if(!paths.length) return;
  for(let i = 0; i < paths.length; i += 100){
    const r = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths.slice(i, i+100), 3600);
    if(r.data) r.data.forEach(x => { if(x.signedUrl) photoUrls.set(x.path, x.signedUrl); });
  }
  render();
}
setInterval(() => { photoUrls.clear(); if(loaded) loadPhotoUrls(); }, 50*60*1000);

/* ---------- Filtering & sorting ---------- */
function opts(sel, label, values, cur){
  sel.innerHTML = '<option value="">'+esc(label)+'</option>' + values.map(v => '<option'+(v === cur ? ' selected' : '')+'>'+esc(v)+'</option>').join("");
}
const uniq = k => [...new Set(assets.map(a => a[k]).filter(Boolean))].sort((x,y) => x.localeCompare(y));
function renderFilters(){
  ["prop","cat","loc"].forEach(f => { const k = { prop:"property", cat:"category", loc:"location" }[f]; if(filter[f] && !uniq(k).includes(filter[f])) filter[f] = ""; });
  opts($("#fProp"), "All properties", uniq("property"), filter.prop);
  opts($("#fCat"), "All categories", uniq("category"), filter.cat);
  opts($("#fLoc"), "All locations", uniq("location"), filter.loc);
  $("#fStatus").innerHTML = '<option value="">All statuses</option>' + Object.keys(STATUS).map(k => '<option value="'+k+'"'+(k === filter.status ? ' selected' : '')+'>'+STATUS[k]+'</option>').join("");
}
function rows(){
  const words = filter.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = assets.filter(a => {
    if(filter.prop && a.property !== filter.prop) return false;
    if(filter.cat && a.category !== filter.cat) return false;
    if(filter.loc && a.location !== filter.loc) return false;
    if(filter.status && a.status !== filter.status) return false;
    if(words.length){
      const hay = COLS.map(c => cellText(c, a)).concat([a.notes, a.supplier, a.invoice]).join(" ").toLowerCase();
      if(!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const col = COLS.find(c => c.k === sortKey) || COLS[1];
  const key = col.sort || (a => cellText(col, a).toLowerCase());
  return list.sort((x, y) => { const a = key(x), b = key(y); return (a < b ? -1 : a > b ? 1 : idNum(x.id) - idNum(y.id)) * sortDir; });
}

/* ---------- Import (CSV / Excel) ---------- */
const IMPORT_FIELDS = [
  ["","Don’t import"],["id","ID"],["property","Property"],["name","Asset name"],["manufacturer","Brand"],["model","Model"],["serial","Serial #"],
  ["category","Category"],["subcategory","Sub-category"],["location","Location"],["actualLocation","Actual location"],["department","Department"],["assignee","Assigned to"],
  ["status","Status"],["condition","Condition"],["purchaseDate","Purchase date"],["supplier","Supplier"],["invoice","Invoice / PO"],
  ["value","Cost"],["usefulLife","Useful life (years)"],["warrantyEnd","Warranty ends"],["lastService","Last service"],["nextService","Next service"],["notes","Notes"]
];
const SYN = {
  id:["id","asset id","asset no","asset number","asset tag","tag","tag no"], property:["property","site","branch","hotel","resort"],
  name:["asset name","name","item","item name","description","asset"], manufacturer:["brand","manufacturer","make"], model:["model","model no"],
  serial:["serial","serial no","serial number","s n","sn"], category:["category","type","asset type"], subcategory:["sub category","subcategory"],
  location:["location","room","area"], actualLocation:["actual location","exact location","specific location","spot","sub location"], department:["department","dept"], assignee:["assigned to","assignee","custodian","user","issued to"],
  status:["status"], condition:["condition"], purchaseDate:["purchase date","date purchased","date acquired","acquired","purchased","acquisition date"],
  supplier:["supplier","vendor"], invoice:["invoice","po","invoice po","invoice no","po no","po number","invoice or po"],
  value:["cost","value","price","purchase cost","amount","unit cost","acquisition cost"], usefulLife:["useful life","useful life years","life years"],
  warrantyEnd:["warranty","warranty ends","warranty end","warranty expiry","warranty until"], lastService:["last service","last maintenance"],
  nextService:["next service","next service due","next maintenance"], notes:["notes","remarks","comment","comments"]
};
const normH = h => String(h || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function autoMap(headers){
  const used = new Set(), map = headers.map(() => "");
  const keys = Object.keys(SYN);
  headers.forEach((h, i) => { const n = normH(h); const k = keys.find(k => !used.has(k) && SYN[k].includes(n)); if(k){ map[i] = k; used.add(k); } });
  headers.forEach((h, i) => { if(map[i]) return; const n = normH(h); const k = keys.find(k => !used.has(k) && SYN[k].some(s => s.length > 3 && n.includes(s))); if(k){ map[i] = k; used.add(k); } });
  return map;
}
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const d = [",",";","\t"].sort((a,b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === d){ row.push(cell); cell = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
let xlsxLoading = null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLoading) xlsxLoading = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = res; s.onerror = () => rej(new Error("The Excel reader couldn’t load.")); document.head.appendChild(s); });
  return xlsxLoading;
}
async function readRows(file){
  if(/\.(xlsx|xls)$/i.test(file.name)){
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header:1, raw:false, dateNF:"yyyy-mm-dd", defval:"" }).filter(r => r.some(c => String(c).trim() !== ""));
  }
  return parseCSV(await file.text());
}
function toISODate(v){
  v = String(v || "").trim(); if(!v) return "";
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v);
  if(m) return m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0");
  m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(v);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; let mo = +m[1], d = +m[2]; if(mo > 12 && d <= 12){ const t = mo; mo = d; d = t; } if(mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return y + "-" + String(mo).padStart(2,"0") + "-" + String(d).padStart(2,"0"); return null; }
  const t = new Date(v); if(!isNaN(t)) return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0");
  return null;
}
function toStatus(v){
  v = String(v || "").toLowerCase();
  if(!v) return "available";
  if(/dispos|sold|scrap|written|donat/.test(v)) return "disposed";
  if(/retir|lost|stolen/.test(v)) return "retired";
  if(/repair|maint|broken|defect|service/.test(v)) return "repair";
  if(/use|assign|deploy|issued|checked out/.test(v)) return "in-use";
  return "available";
}
function toCondition(v){ v = String(v || "").trim(); const k = ["New","Good","Fair","Poor","Damaged","Disposed"].find(c => c.toLowerCase() === v.toLowerCase()); return k || v; }
function toNumber(v){ v = String(v || "").replace(/[^0-9.\-]/g, ""); if(v === "" || v === "-" || v === ".") return ""; const n = Number(v); return isNaN(n) ? null : n; }
function normalizeId(text){ const m = /\b([A-Za-z]{2,5})-(\d{1,6})\b/.exec(String(text || "").trim()); return m ? "Asset-" + String(parseInt(m[2], 10)).padStart(3, "0") : null; }

function buildImport(){
  const existing = new Set(assets.map(a => a.id)), mode = (document.querySelector('input[name="impDup"]:checked') || {}).value || "skip";
  let max = Math.max(0, ...assets.map(a => idNum(a.id)));
  const get = (r, k) => { const i = imp.map.indexOf(k); return i < 0 ? "" : r[i]; };
  imp.rows.forEach(r => { const id = imp.map.includes("id") ? normalizeId(get(r, "id")) : null; if(id) max = Math.max(max, idNum(id)); });
  const fresh = [], updates = [], skipped = [], warn = [], seen = new Set();
  imp.rows.forEach((r, n) => {
    const line = n + 2, name = get(r, "name");
    if(!name){ skipped.push("Row " + line + ": no asset name"); return; }
    const data = {};
    IMPORT_FIELDS.forEach(([k]) => { if(!k || k === "id" || !imp.map.includes(k)) return; const raw = get(r, k);
      if(k === "status") data.status = toStatus(raw);
      else if(k === "condition") data.condition = toCondition(raw);
      else if(["purchaseDate","warrantyEnd","lastService","nextService"].includes(k)){ const d = toISODate(raw); if(d === null){ warn.push("Row " + line + ": couldn’t read date “" + raw + "”"); data[k] = ""; } else data[k] = d; }
      else if(k === "value" || k === "usefulLife"){ const v = toNumber(raw); if(v === null){ warn.push("Row " + line + ": couldn’t read number “" + raw + "”"); data[k] = ""; } else data[k] = v; }
      else data[k] = raw;
    });
    let id = imp.map.includes("id") ? normalizeId(get(r, "id")) : null;
    if(id && seen.has(id)){ warn.push("Row " + line + ": duplicate ID " + id + " in file, given a new ID"); id = null; }
    if(id && existing.has(id)){
      if(mode === "skip"){ skipped.push("Row " + line + ": " + id + " already exists"); seen.add(id); return; }
      const cur = assets.find(a => a.id === id), merged = Object.assign({}, cur);
      Object.keys(data).forEach(k => { if(data[k] !== "" && data[k] != null) merged[k] = data[k]; });
      merged.updatedAt = Date.now(); merged.history = (cur.history || []).concat([{ t:Date.now(), text:"Updated from import (" + imp.file.name + ")", by:myName }]).slice(-100);
      delete merged.id; updates.push({ id, data: merged }); seen.add(id); return;
    }
    if(!id){ max += 1; id = "Asset-" + String(max).padStart(3, "0"); }
    seen.add(id);
    if(!data.status) data.status = "available";
    const rec = Object.assign({ createdAt:Date.now(), updatedAt:Date.now(), history:[{ t:Date.now(), text:"Imported from " + imp.file.name, by:myName }] }, data);
    fresh.push({ id, data: rec });
  });
  return { fresh, updates, skipped, warn };
}

  const ok = await sb.rpc("is_staff");
  if(ok.error || !ok.data){ toLogin(); return; }
  const prof = await sb.from("staff").select("username,name,must_change_password").eq("email", (me.email || "").toLowerCase()).maybeSingle();
  if(prof.data && prof.data.must_change_password){ toLogin(); return; }
  myName = (prof.data && prof.data.username) || me.email;
  $("#who").textContent = myName;
  document.documentElement.classList.remove("booting");
  sb.auth.onAuthStateChange((event, s) => { if(!s) setTimeout(() => toLogin(signingOut ? "signedout" : ""), 0); });
  await loadAll(); subscribe();
}
$("#signOut").addEventListener("click", async () => { signingOut = true; await sb.auth.signOut(); toLogin("signedout"); });
start();
})();
</script>
</body>
</html>
